# Gradle JVM memory tuning (Kotlin daemon memory issues on low-memory hosts)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.country=CN -Duser.language=zh -Duser.variant
# Windows 低内存环境：关闭并行构建与按需配置，降低峰值 heap 占用
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
# 禁用 gradle 文件 watcher，避免 native file watcher 吃光 heap
org.gradle.vfs.watch=false
org.gradle.file.watching=false
# Kotlin 编译用进程内模式（避免 daemon 单独占 heap）
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m
kotlin.compiler.execution.strategy=in-process
# 减少 ksp/kapt worker 内存
kapt.use.worker.api=false
