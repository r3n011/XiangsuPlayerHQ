# Gradle JVM memory tuning（Gradle 与 Kotlin daemon 双进程共享物理内存，需留足余量给系统）
# 注意：物理内存耗尽会触发 KSP 的 LowMemoryWatcher，刷盘时写坏 kspCaches/**/lookups.tab_i
#      （报 "Storage corrupted"）。构建前请确认可用物理内存 ≥ 12G；若报错需删除 app/build/kspCaches 后重建。
# ⚡ heap 从 4096m 提到 6144m：mergeResources 合并矢量图时（AGP 会把大尺寸 vector 渲染成
#    预览位图，项目里有 800dp/1024dp/1536dp 的大图）曾 OOM（Java heap space），
#    4G 在并行合并 + 旧 daemon 复用时会顶到上限；如内存紧张可改回 4096m。
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8 -Duser.country=CN -Duser.language=zh -Duser.variant
# Windows 低内存环境：关闭并行构建与按需配置，降低峰值 heap 占用
org.gradle.parallel=true
# C 盘空间紧张时临时关闭 build cache（避免缓存写入把磁盘写满导致构建失败）
org.gradle.caching=true
org.gradle.configureondemand=false
# 禁用 gradle 文件 watcher，避免 native file watcher 吃光 heap
org.gradle.vfs.watch=false
org.gradle.file.watching=false
# Kotlin daemon 独立运行，避免与 R8 争抢进程内 heap（4096m，缓解大型 Kotlin 文件编译时 GC 抖动导致的极度缓慢；如内存不足可改回 2048m）
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=384m
kotlin.compiler.execution.strategy=daemon
# 减少 ksp/kapt worker 内存
kapt.use.worker.api=false
# R8 优化：开启 fullMode 以最大化死代码裁剪（此前为缓解内存压力关闭，收窄 proguard keep 后内存压力已下降）
android.enableR8.fullMode=true

# ⚡ 构建提速：构建缓存 + 模块并行 + 配置缓存（增量构建显著加快）
org.gradle.configuration-cache=true
