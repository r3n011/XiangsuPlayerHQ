# Gradle JVM memory tuning（本机内存吃紧：Gradle 与 Kotlin daemon 双进程需共享物理内存，调低避免编译 OOM；Release 打包前可临时调高）
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8 -Duser.country=CN -Duser.language=zh -Duser.variant
# Windows 低内存环境：关闭并行构建与按需配置，降低峰值 heap 占用
org.gradle.parallel=true
# C 盘空间紧张时临时关闭 build cache（避免缓存写入把磁盘写满导致构建失败）
org.gradle.caching=false
org.gradle.configureondemand=false
# 禁用 gradle 文件 watcher，避免 native file watcher 吃光 heap
org.gradle.vfs.watch=false
org.gradle.file.watching=false
# Kotlin daemon 独立运行，避免与 R8 争抢进程内 heap（1536m，防止 FixStack/Not enough memory 类失败）
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m
kotlin.compiler.execution.strategy=daemon
# 减少 ksp/kapt worker 内存
kapt.use.worker.api=false
# R8 优化：开启 fullMode 以最大化死代码裁剪（此前为缓解内存压力关闭，收窄 proguard keep 后内存压力已下降）
android.enableR8.fullMode=true
